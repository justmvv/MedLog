name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only to create a release for a tag
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # The vX.Y.Z tag must match version: in pubspec.yaml.
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(grep -E '^version:' pubspec.yaml | awk '{print $2}'); v=${v%%+*}
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $v in pubspec.yaml"; exit 1; }

      # Project site: https://<user>.github.io/<repo>/
      - name: Build PWA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: tool/build_web.sh --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

      - name: Zip the build for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd build/web && zip -qr "$GITHUB_WORKSPACE/medlog-web-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          # The version's section of CHANGELOG.md becomes the release notes.
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ || /^\[.*\]: / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "medlog-web-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

  deploy:
    # The github-pages environment accepts only the default branch by default;
    # a vX.Y.Z tag publishes a release with the zipped build (steps above).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
